<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Log in - CodeForge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar" id="navbar"></nav>
    </div>

    <div class="container" style="max-width: 400px; padding-top: 60px;">
        <div class="card">
            <h2 style="margin-bottom: 24px;">Log in</h2>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="input" type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log in</button>
                <p id="error-message" class="error-text" style="display: none;"></p>
            </form>

            <p class="text-muted" style="margin-top: 20px; text-align: center;">
                Don't have an account? <a href="/pages/register.html">Sign up</a>
            </p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById("error-message");
            errorEl.style.display = "none";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const result = await api.post("/auth/login", { username, password });
                setToken(result.token);
                window.location.href = "/pages/dashboard.html";
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = "block";
            }
        });
    </script>
</body>
</html>
