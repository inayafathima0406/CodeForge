<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Leaderboard - CodeForge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar" id="navbar"></nav>
        <div style="padding: 32px 0;">
            <h1 style="font-size: 28px; margin-bottom: 8px;">Leaderboard</h1>
            <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                <button class="btn btn-primary" id="tab-xp" onclick="switchTab('xp')">By XP</button>
                <button class="btn btn-outline" id="tab-solved" onclick="switchTab('solved')">By Problems Solved</button>
            </div>
            <p id="loading-text" class="text-muted">Loading...</p>
            <p id="error-message" class="error-text" style="display: none;"></p>
            <div id="leaderboard-list"></div>

            <h2 style="font-size: 20px; margin: 32px 0 14px;">My Badges</h2>
            <div id="badges-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;"></div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/leaderboard.js"></script>
</body>
</html>
