<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin - CodeForge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar" id="navbar"></nav>
        <div style="padding: 32px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="font-size: 28px;">Admin: Questions</h1>
                <button class="btn btn-primary" onclick="openForm()">+ New Question</button>
            </div>
            <p id="loading-text" class="text-muted">Loading...</p>
            <p id="error-message" class="error-text" style="display: none;"></p>
            <div id="questions-list"></div>
        </div>
    </div>

    <div id="form-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; overflow-y:auto;">
        <div class="container" style="max-width:700px; padding: 40px 16px;">
            <div class="card">
                <h2 id="form-title" style="margin-bottom:16px;">New Question</h2>
                <form id="question-form">
                    <input type="hidden" id="q-id">
                    <div class="form-group"><label>Title</label><input class="input" id="q-title" required></div>
                    <div class="form-group"><label>Statement</label><textarea class="input" id="q-statement" rows="3" required></textarea></div>
                    <div class="form-group"><label>Input Description</label><textarea class="input" id="q-input" rows="2" required></textarea></div>
                    <div class="form-group"><label>Output Description</label><textarea class="input" id="q-output" rows="2" required></textarea></div>
                    <div class="form-group"><label>Constraints</label><textarea class="input" id="q-constraints" rows="2" required></textarea></div>
                    <div style="display:flex; gap:12px;">
                        <div class="form-group" style="flex:1;"><label>Difficulty</label>
                            <select class="input" id="q-difficulty"><option>EASY</option><option>MEDIUM</option><option>HARD</option></select>
                        </div>
                        <div class="form-group" style="flex:1;"><label>Topic</label><input class="input" id="q-topic" required placeholder="e.g. Arrays"></div>
                    </div>
                    <label style="margin-top:12px;">Test Cases</label>
                    <div id="test-cases"></div>
                    <button type="button" class="btn btn-outline" onclick="addTestCaseRow()" style="margin:8px 0;">+ Add Test Case</button>
                    <p id="form-error" class="error-text" style="display:none;"></p>
                    <div style="display:flex; gap:12px; margin-top:16px;">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" class="btn btn-outline" onclick="closeForm()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin-guard.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
