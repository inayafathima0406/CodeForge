<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dashboard - CodeForge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar" id="navbar"></nav>
        <div style="padding: 32px 0;">
            <h1 style="font-size: 28px; margin-bottom: 20px;">Dashboard</h1>
            <p id="loading-text" class="text-muted">Loading...</p>
            <p id="error-message" class="error-text" style="display: none;"></p>
            <div id="dashboard-content" style="display: none;">

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px;">
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700;" id="stat-attempted"></div>
                        <div class="text-muted" style="font-size: 13px;">Attempted</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-success);" id="stat-solved"></div>
                        <div class="text-muted" style="font-size: 13px;">Solved</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700;" id="stat-accuracy"></div>
                        <div class="text-muted" style="font-size: 13px;">Accuracy</div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 28px; font-weight: 700; color: var(--color-warning);" id="stat-streak"></div>
                        <div class="text-muted" style="font-size: 13px;">Day Streak</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px;">
                    <div class="card">
                        <h3 style="margin-bottom: 14px;">Topic Progress</h3>
                        <div id="topic-progress"></div>
                    </div>
                    <div class="card">
                        <h3 style="margin-bottom: 14px;">Difficulty Progress</h3>
                        <div id="difficulty-progress"></div>
                    </div>
                </div>

                <h3 style="margin-bottom: 14px;">Recent Submissions</h3>
                <div id="recent-submissions"></div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
