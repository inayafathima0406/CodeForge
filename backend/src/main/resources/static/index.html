<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CodeForge</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <strong>CodeForge</strong>
            <div class="navbar-links">
                <a href="/pages/login.html">Log in</a>
                <a href="/pages/register.html" class="btn btn-primary">Sign up</a>
            </div>
        </nav>

        <div style="padding: 80px 0; text-align: center;">
            <h1 style="font-size: 40px; margin-bottom: 16px;">Practice DSA. Get placement-ready.</h1>
            <p class="text-muted" style="font-size: 18px; margin-bottom: 32px;">
                Solve curated problems, take timed tests, and get AI-powered feedback when you're stuck.
            </p>
            <a href="/pages/register.html" class="btn btn-primary" style="padding: 12px 32px; font-size: 16px;">
                Get started
            </a>
        </div>
    </div>

    <script>
        if (localStorage.getItem("cf_token")) {
            document.querySelector(".navbar-links").innerHTML =
                '<a href="/pages/dashboard.html" class="btn btn-primary">Go to Dashboard</a>';
        }
    </script>
</body>
</html>
