spring.application.name=backend

# Database connection (secrets come from environment variables, never typed here)
spring.datasource.url=jdbc:mysql://localhost:3306/codeforge?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:codeforge_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# JWT settings (the secret comes from an environment variable, never typed here)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
# Judge0 code execution (URL and key can be overridden by environment variables)
app.judge0.url=${JUDGE0_URL:https://ce.judge0.com}
app.judge0.api-key=${JUDGE0_API_KEY:}
app.judge0.java-language-id=62

# Claude AI Mentor
app.claude.api-key=${CLAUDE_API_KEY:}
app.claude.model=claude-sonnet-4-5-20250929
